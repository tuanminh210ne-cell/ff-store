<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Đổi mật khẩu - FF Store</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    body { font-family: 'Inter', sans-serif; background: #0f0f0f; }
    .glow { box-shadow: 0 0 20px rgba(57,255,20,0.3); }
  </style>
</head>
<body class="bg-[#0f0f0f] text-white min-h-screen flex items-center justify-center p-4">
  <div class="w-full max-w-md">
    <!-- Logo -->
    <div class="text-center mb-8">
      <h1 class="text-3xl font-bold text-green-400">🔐 Đổi mật khẩu</h1>
      <p class="text-gray-500 mt-2">FF Store Admin</p>
    </div>

    <!-- Form đăng nhập -->
    <div id="login-section" class="bg-[#1a1a2e] rounded-2xl p-6 border border-gray-800">
      <h2 class="text-lg font-semibold mb-4">Bước 1: Đăng nhập</h2>
      <input id="username" type="text" placeholder="Username" value="admin"
        class="w-full bg-[#0f0f0f] border border-gray-700 rounded-xl px-4 py-3 mb-3 text-white placeholder-gray-500 focus:border-green-400 focus:outline-none">
      <input id="old-password" type="password" placeholder="Mật khẩu hiện tại"
        class="w-full bg-[#0f0f0f] border border-gray-700 rounded-xl px-4 py-3 mb-4 text-white placeholder-gray-500 focus:border-green-400 focus:outline-none">
      <button onclick="login()" class="w-full bg-green-500 hover:bg-green-400 text-black font-bold py-3 rounded-xl transition-all glow">
        Đăng nhập
      </button>
      <p id="login-msg" class="text-center mt-3 text-sm"></p>
    </div>

    <!-- Form đổi mật khẩu -->
    <div id="change-section" class="bg-[#1a1a2e] rounded-2xl p-6 border border-gray-800 hidden">
      <h2 class="text-lg font-semibold mb-4">Bước 2: Nhập mật khẩu mới</h2>
      <input id="new-password" type="password" placeholder="Mật khẩu mới (ít nhất 6 ký tự)"
        class="w-full bg-[#0f0f0f] border border-gray-700 rounded-xl px-4 py-3 mb-3 text-white placeholder-gray-500 focus:border-green-400 focus:outline-none">
      <input id="confirm-password" type="password" placeholder="Nhập lại mật khẩu mới"
        class="w-full bg-[#0f0f0f] border border-gray-700 rounded-xl px-4 py-3 mb-4 text-white placeholder-gray-500 focus:border-green-400 focus:outline-none">
      <button onclick="changePassword()" class="w-full bg-green-500 hover:bg-green-400 text-black font-bold py-3 rounded-xl transition-all glow">
        🔒 Đổi mật khẩu
      </button>
      <p id="change-msg" class="text-center mt-3 text-sm"></p>
    </div>

    <!-- Thành công -->
    <div id="success-section" class="bg-[#1a1a2e] rounded-2xl p-6 border border-green-500 text-center hidden">
      <div class="text-5xl mb-4">✅</div>
      <h2 class="text-xl font-bold text-green-400 mb-2">Đổi mật khẩu thành công!</h2>
      <p class="text-gray-400 mb-4">Lần sau đăng nhập bằng mật khẩu mới</p>
      <a href="/admin" class="inline-block bg-green-500 hover:bg-green-400 text-black font-bold py-3 px-6 rounded-xl transition-all">
        Về trang Admin
      </a>
    </div>
  </div>

  <script>
    let token = "";

    async function login() {
      const username = document.getElementById("username").value.trim();
      const password = document.getElementById("old-password").value;
      const msg = document.getElementById("login-msg");

      if (!username || !password) {
        msg.innerHTML = '<span class="text-red-400">Vui lòng nhập đầy đủ</span>';
        return;
      }

      msg.innerHTML = '<span class="text-yellow-400">Đang đăng nhập...</span>';

      try {
        const res = await fetch("/api/auth/login", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ username, password })
        });
        const data = await res.json();

        if (!res.ok) {
          msg.innerHTML = `<span class="text-red-400">${data.detail?.error || 'Sai thông tin đăng nhập'}</span>`;
          return;
        }

        token = data.access_token;
        msg.innerHTML = '<span class="text-green-400">✅ Đăng nhập thành công!</span>';

        // Hiện form đổi mật khẩu
        document.getElementById("login-section").classList.add("hidden");
        document.getElementById("change-section").classList.remove("hidden");
      } catch (err) {
        msg.innerHTML = '<span class="text-red-400">Lỗi kết nối</span>';
      }
    }

    async function changePassword() {
      const newPass = document.getElementById("new-password").value;
      const confirmPass = document.getElementById("confirm-password").value;
      const msg = document.getElementById("change-msg");

      if (!newPass || !confirmPass) {
        msg.innerHTML = '<span class="text-red-400">Vui lòng nhập đầy đủ</span>';
        return;
      }

      if (newPass !== confirmPass) {
        msg.innerHTML = '<span class="text-red-400">Mật khẩu mới không khớp</span>';
        return;
      }

      if (newPass.length < 6) {
        msg.innerHTML = '<span class="text-red-400">Mật khẩu phải có ít nhất 6 ký tự</span>';
        return;
      }

      msg.innerHTML = '<span class="text-yellow-400">Đang đổi mật khẩu...</span>';

      try {
        const res = await fetch("/api/admin/change-password", {
          method: "POST",
          headers: {
            "Content-Type": "application/json",
            "Authorization": `Bearer ${token}`
          },
          body: JSON.stringify({
            old_password: document.getElementById("old-password").value,
            new_password: newPass
          })
        });
        const data = await res.json();

        if (!res.ok) {
          msg.innerHTML = `<span class="text-red-400">${data.detail?.error || 'Lỗi đổi mật khẩu'}</span>`;
          return;
        }

        // Hiện thành công
        document.getElementById("change-section").classList.add("hidden");
        document.getElementById("success-section").classList.remove("hidden");
      } catch (err) {
        msg.innerHTML = '<span class="text-red-400">Lỗi kết nối</span>';
      }
    }

    // Enter key để submit
    document.getElementById("old-password").addEventListener("keyup", e => { if (e.key === "Enter") login(); });
    document.getElementById("confirm-password").addEventListener("keyup", e => { if (e.key === "Enter") changePassword(); });
  </script>
</body>
</html>
