<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Danh sách acc - FF Store</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@700;900&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <script>
    tailwind.config = {
      theme: { extend: { colors: { 'neon-green': '#39ff14', 'neon-pink': '#ff6ec7', 'navy': '#0a1628', 'dark': '#000000', 'card': '#0d1117', 'border': '#1e293b' } } }
    }
  </script>
  <style>
    .font-game { font-family: 'Orbitron', sans-serif; }
    .font-body { font-family: 'Inter', sans-serif; }
    ::-webkit-scrollbar { width: 6px; }
    ::-webkit-scrollbar-track { background: #000; }
    ::-webkit-scrollbar-thumb { background: #1e293b; border-radius: 3px; }
    .glow-green { box-shadow: 0 0 15px rgba(57, 255, 20, 0.3); }
    .glow-green:hover { box-shadow: 0 0 25px rgba(57, 255, 20, 0.5); }
    .text-glow { text-shadow: 0 0 20px rgba(57, 255, 20, 0.5); }
    .text-glow-pink { text-shadow: 0 0 20px rgba(255, 110, 199, 0.5); }
    .card-hover { transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1); }
    .card-hover:hover { transform: translateY(-8px); box-shadow: 0 20px 40px rgba(57, 255, 20, 0.15); }
    .skeleton { background: linear-gradient(90deg, #0d1117 25%, #1e293b 50%, #0d1117 75%); background-size: 200% 100%; animation: shimmer 1.5s infinite; }
    @keyframes shimmer { 0% { background-position: 200% 0; } 100% { background-position: -200% 0; } }
    .gradient-text { background: linear-gradient(135deg, #39ff14, #ff6ec7); -webkit-background-clip: text; -webkit-text-fill-color: transparent; background-clip: text; }
    .filter-chip { transition: all 0.2s ease; }
    .filter-chip.active { background: #39ff14; color: #000; border-color: #39ff14; font-weight: 600; }
    .page-btn { transition: all 0.2s ease; }
    .page-btn.active { background: #39ff14; color: #000; font-weight: 600; }
  </style>
</head>
<body class="bg-black text-white font-body min-h-screen flex flex-col">

  <!-- HEADER -->
  <header class="bg-black/90 backdrop-blur-md border-b border-[#1e293b] sticky top-0 z-50">
    <div class="max-w-7xl mx-auto px-4 py-3 flex items-center justify-between">
      <a href="/home" class="flex items-center gap-3 group">
        <div class="w-12 h-12 rounded-full overflow-hidden border-2 border-neon-green glow-green group-hover:border-neon-pink transition-all">
          <img src="https://i.pinimg.com/564x/8c/e0/aa/8ce0aa94e9e5d15e0a4b12e0e6b5a7d7.jpg" alt="Logo" class="w-full h-full object-cover"
               onerror="this.src='data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><circle cx=%2250%22 cy=%2250%22 r=%2250%22 fill=%22%2339ff14%22/><text x=%2250%22 y=%2265%22 text-anchor=%22middle%22 font-size=%2240%22 font-weight=%22bold%22 fill=%22black%22>FF</text></svg>'">
        </div>
        <div>
          <h1 class="font-game text-xl text-neon-green group-hover:text-neon-pink transition-colors">FF STORE</h1>
          <p class="text-xs text-gray-500">Acc Free Fire Uy Tín #1</p>
        </div>
      </a>
      <nav class="hidden md:flex items-center gap-8">
        <a href="/home" class="text-gray-400 hover:text-neon-pink transition-colors text-sm tracking-wide">TRANG CHỦ</a>
        <a href="/danh-sach-acc" class="text-neon-green font-semibold border-b-2 border-neon-green pb-1 text-sm tracking-wide">DANH SÁCH</a>
        <a href="/admin" class="text-gray-400 hover:text-neon-pink transition-colors text-sm tracking-wide">ADMIN</a>
      </nav>
      <button onclick="document.getElementById('mobile-menu').classList.toggle('hidden')" class="md:hidden text-gray-400 hover:text-neon-green">
        <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 6h16M4 12h16M4 18h16"/></svg>
      </button>
    </div>
    <div id="mobile-menu" class="hidden md:hidden border-t border-[#1e293b] bg-black/95">
      <a href="/home" class="block px-4 py-3 text-gray-400 hover:text-neon-pink">TRANG CHỦ</a>
      <a href="/danh-sach-acc" class="block px-4 py-3 text-neon-green font-semibold border-l-2 border-neon-green">DANH SÁCH</a>
      <a href="/admin" class="block px-4 py-3 text-gray-400 hover:text-neon-pink">ADMIN</a>
    </div>
  </header>

  <!-- MAIN -->
  <main class="flex-1 max-w-7xl mx-auto px-4 py-8 w-full">
    <div class="mb-8">
      <h2 class="font-game text-2xl md:text-3xl gradient-text mb-2">DANH SÁCH ACC</h2>
      <p id="result-count" class="text-gray-500 text-sm mb-6">Đang tải...</p>

      <!-- Bộ lọc giá -->
      <div class="flex flex-wrap gap-2">
        <button onclick="setFilter('all')" data-filter="all" class="filter-chip active bg-[#0d1117] border border-[#1e293b] text-gray-300 px-4 py-2 rounded-full text-sm hover:border-neon-green">Tất cả</button>
        <button onclick="setFilter('0-1000000')" data-filter="0-1000000" class="filter-chip bg-[#0d1117] border border-[#1e293b] text-gray-300 px-4 py-2 rounded-full text-sm hover:border-neon-green">Dưới 1 triệu</button>
        <button onclick="setFilter('1000000-2000000')" data-filter="1000000-2000000" class="filter-chip bg-[#0d1117] border border-[#1e293b] text-gray-300 px-4 py-2 rounded-full text-sm hover:border-neon-green">1 - 2 triệu</button>
        <button onclick="setFilter('2000000-3000000')" data-filter="2000000-3000000" class="filter-chip bg-[#0d1117] border border-[#1e293b] text-gray-300 px-4 py-2 rounded-full text-sm hover:border-neon-green">2 - 3 triệu</button>
        <button onclick="setFilter('3000000-5000000')" data-filter="3000000-5000000" class="filter-chip bg-[#0d1117] border border-[#1e293b] text-gray-300 px-4 py-2 rounded-full text-sm hover:border-neon-green">3 - 5 triệu</button>
        <button onclick="setFilter('5000000-10000000')" data-filter="5000000-10000000" class="filter-chip bg-[#0d1117] border border-[#1e293b] text-gray-300 px-4 py-2 rounded-full text-sm hover:border-neon-green">5 - 10 triệu</button>
        <button onclick="setFilter('10000000-999999999')" data-filter="10000000-999999999" class="filter-chip bg-[#0d1117] border border-[#1e293b] text-gray-300 px-4 py-2 rounded-full text-sm hover:border-neon-green">Trên 10 triệu</button>
      </div>
    </div>

    <div id="account-list" class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 xl:grid-cols-4 gap-5 mb-8"></div>
    <div id="pagination" class="flex flex-wrap justify-center gap-2 mt-8"></div>
  </main>

  <!-- FOOTER -->
  <footer class="bg-[#0d1117] border-t border-[#1e293b]">
    <div class="max-w-7xl mx-auto px-4 py-8 text-center text-gray-600 text-xs">&copy; 2026 FF Store. Mọi quyền được bảo lưu.</div>
  </footer>

  <script>
    const BASE_URL = window.location.origin;
    const PER_PAGE = 10;
    let allAccounts = [], filteredAccounts = [], currentPage = 1, currentFilter = 'all';

    document.addEventListener("DOMContentLoaded", () => { loadAccounts(); });

    async function loadAccounts() {
      const container = document.getElementById("account-list");
      showSkeleton(container);
      try {
        const res = await fetch(`${BASE_URL}/api/accounts`);
        allAccounts = await res.json();
        applyFilter();
      } catch (err) {
        container.innerHTML = `<div class="col-span-full text-center py-16"><p class="text-red-400">Không thể tải dữ liệu</p></div>`;
      }
    }

    function applyFilter() {
      if (currentFilter === 'all') { filteredAccounts = [...allAccounts]; }
      else {
        const [min, max] = currentFilter.split('-').map(Number);
        filteredAccounts = allAccounts.filter(acc => acc.price >= min && acc.price < max);
      }
      currentPage = 1;
      renderAccounts();
      renderPagination();
    }

    function setFilter(filter) {
      currentFilter = filter;
      document.querySelectorAll('.filter-chip').forEach(btn => {
        btn.classList.remove('active');
        if (btn.dataset.filter === filter) btn.classList.add('active');
      });
      applyFilter();
    }

    function renderAccounts() {
      const container = document.getElementById("account-list");
      const countEl = document.getElementById("result-count");
      const total = filteredAccounts.length;
      const start = (currentPage - 1) * PER_PAGE;
      const end = start + PER_PAGE;
      const pageAccounts = filteredAccounts.slice(start, end);
      countEl.textContent = `Hiển thị ${start + 1}-${Math.min(end, total)} trong ${total} acc`;
      if (total === 0) { container.innerHTML = `<div class="col-span-full text-center py-16"><p class="text-gray-500">Không có acc nào</p></div>`; return; }
      container.innerHTML = pageAccounts.map(acc => renderCard(acc)).join('');
    }

    function renderCard(acc) {
      const priceFormatted = acc.price.toLocaleString("vi-VN");
      const isSold = acc.status === "Đã bán";
      const rankBadge = getRankBadge(acc.rank_level);
      return `
        <div class="bg-[#0d1117] rounded-2xl overflow-hidden border border-[#1e293b] card-hover flex flex-col ${isSold ? 'opacity-60' : ''}">
          <div class="relative aspect-[4/3] overflow-hidden">
            <img src="${acc.image_url || 'https://placehold.co/400x300/0d1117/1e293b?text=No+Image'}" alt="${acc.title}"
                 class="w-full h-full object-cover ${isSold ? 'grayscale' : ''}"
                 onerror="this.onerror=null; this.src='https://placehold.co/400x300/0d1117/1e293b?text=No+Image'">
            ${rankBadge}
            ${isSold ? '<span class="absolute top-3 right-3 bg-red-500/90 text-white text-xs font-bold px-3 py-1 rounded-full backdrop-blur-sm">ĐÃ BÁN</span>' : ''}
          </div>
          <div class="p-4 flex flex-col flex-1">
            <h4 class="text-white font-semibold text-sm leading-snug mb-3 min-h-[2.5rem]" style="display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;">${escapeHtml(acc.title)}</h4>
            <p class="text-neon-green font-game text-lg font-bold mb-4 mt-auto">${priceFormatted} <span class="text-xs font-body font-normal text-gray-500">VNĐ</span></p>
            <a href="/acc/${acc.slug || acc.id}" target="_blank"
               class="block text-center ${isSold ? 'bg-gray-700 text-gray-400' : 'bg-neon-green hover:bg-green-400 text-black glow-green'} font-semibold py-2.5 rounded-xl transition-all text-sm">
              ${isSold ? 'Đã bán' : 'Xem chi tiết'}
            </a>
          </div>
        </div>`;
    }

    function renderPagination() {
      const container = document.getElementById("pagination");
      const totalPages = Math.ceil(filteredAccounts.length / PER_PAGE);
      if (totalPages <= 1) { container.innerHTML = ''; return; }
      let html = '';
      if (currentPage > 1) html += `<button onclick="goToPage(${currentPage - 1})" class="page-btn bg-[#0d1117] border border-[#1e293b] text-gray-300 w-10 h-10 rounded-lg text-sm hover:border-neon-green">‹</button>`;
      for (let i = 1; i <= totalPages; i++) {
        if (totalPages > 7) {
          if (i === 1 || i === totalPages || (i >= currentPage - 1 && i <= currentPage + 1)) {
            html += `<button onclick="goToPage(${i})" class="page-btn ${i === currentPage ? 'active' : ''} bg-[#0d1117] border border-[#1e293b] text-gray-300 w-10 h-10 rounded-lg text-sm hover:border-neon-green">${i}</button>`;
          } else if (i === currentPage - 2 || i === currentPage + 2) {
            html += `<span class="text-gray-600 w-10 h-10 flex items-center justify-center">...</span>`;
          }
        } else {
          html += `<button onclick="goToPage(${i})" class="page-btn ${i === currentPage ? 'active' : ''} bg-[#0d1117] border border-[#1e293b] text-gray-300 w-10 h-10 rounded-lg text-sm hover:border-neon-green">${i}</button>`;
        }
      }
      if (currentPage < totalPages) html += `<button onclick="goToPage(${currentPage + 1})" class="page-btn bg-[#0d1117] border border-[#1e293b] text-gray-300 w-10 h-10 rounded-lg text-sm hover:border-neon-green">›</button>`;
      container.innerHTML = html;
    }

    function goToPage(page) { currentPage = page; renderAccounts(); renderPagination(); window.scrollTo({ top: 0, behavior: 'smooth' }); }

    function getRankBadge(rankLevel) {
      if (!rankLevel) return "";
      const level = parseInt(rankLevel);
      let bg, text, label;
      if (!isNaN(level)) {
        if (level >= 70) { bg = "bg-cyan-500/20 border-cyan-400/50"; text = "text-cyan-300"; }
        else if (level >= 50) { bg = "bg-purple-500/20 border-purple-400/50"; text = "text-purple-300"; }
        else if (level >= 30) { bg = "bg-yellow-500/20 border-yellow-400/50"; text = "text-yellow-300"; }
        else { bg = "bg-gray-500/20 border-gray-400/50"; text = "text-gray-300"; }
        label = `Lv ${level}`;
      } else { bg = "bg-gray-500/20 border-gray-400/50"; text = "text-gray-300"; label = rankLevel; }
      return `<span class="absolute top-3 left-3 ${bg} ${text} border text-xs font-semibold px-2.5 py-1 rounded-full backdrop-blur-sm">${escapeHtml(label)}</span>`;
    }

    function showSkeleton(container) {
      let html = '';
      for (let i = 0; i < 8; i++) html += `<div class="bg-[#0d1117] rounded-2xl overflow-hidden border border-[#1e293b]"><div class="aspect-[4/3] skeleton"></div><div class="p-4 space-y-3"><div class="h-4 skeleton rounded w-3/4"></div><div class="h-4 skeleton rounded w-1/2"></div><div class="h-8 skeleton rounded-xl w-full mt-4"></div></div></div>`;
      container.innerHTML = html;
    }

    function escapeHtml(text) { if (!text) return ""; const div = document.createElement("div"); div.textContent = text; return div.innerHTML; }
  </script>
</body>
</html>
