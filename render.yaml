services:
  - type: web
    name: ff-store
    runtime: python
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: SECRET_KEY
        generateValue: true
      - key: ALLOWED_ORIGINS
        value: https://thuhasemiminisizeandsuperminibabynumberoneintheworld.io.vn
      - key: ADMIN_USERNAME
        value: admin
      - key: ADMIN_PASSWORD
        sync: false
      - key: IMGBB_KEYS
        sync: false
      - key: CLOUDINARY_CLOUD
        sync: false
      - key: CLOUDINARY_PRESET
        sync: false
      - key: GAS_URL
        sync: false
